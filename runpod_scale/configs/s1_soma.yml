giada_runpod_scale:
  stage: s1
  target_transitions: 600000
  trajectory_duration_ms: 6000
  # One trajectory per shard keeps the static modulo assignment balanced across
  # the measured eight-worker configuration (12--13 trajectories per worker).
  trajectories_per_shard: 1
  storage_profile: soma_paper
  sampled_segments_per_transition: 1
  root_seed: 9100001
  validation_trajectory_fraction: 0.03333333333333333
  compression: lzf
  chunk_transitions: 256
  progress_interval_s: 30
